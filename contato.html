<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel - Entre em Contato</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:url('fundocontato.jpg') center/cover no-repeat fixed;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
header{position:fixed;top:0;left:0;width:100%;padding:0 40px;z-index:100}
.logo-box{width:85px;height:95px;background:#000;border-radius:0 0 25px 25px;display:flex;justify-content:center;align-items:center}
.logo-box img{width:50px}
.menu-btn{position:fixed;top:0;right:40px;width:85px;height:95px;background:#000;border:none;border-radius:0 0 25px 25px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;cursor:pointer;z-index:110}
.menu-line{width:35px;height:3px;background:#fff;transition:.3s}
.menu-btn.active .menu-line:nth-child(1){transform:translateY(10px) rotate(45deg)}
.menu-btn.active .menu-line:nth-child(2){opacity:0}
.menu-btn.active .menu-line:nth-child(3){transform:translateY(-10px) rotate(-45deg)}
.nav-menu{position:fixed;top:0;right:-100%;width:100%;height:100%;background:#3b4ca8;display:flex;align-items:flex-start;justify-content:center;flex-direction:column;padding-left:11%;transition:right .4s;z-index:105}
.nav-menu.active{right:0}
.menu-open-logo{position:absolute;top:40px;left:40px}
.menu-open-logo img{width:50px}
.nav-links-container{display:flex;flex-direction:column;gap:24px}
.nav-menu a{color:#fff;font:900 3.5rem 'Arial Narrow',Impact,sans-serif;text-decoration:none;text-transform:uppercase}
.nav-menu a:hover,.nav-menu a:focus,.nav-menu a:active{text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:3px}
.container{text-align:center;padding:20px}
h1{font-size:3rem;max-width:1000px;margin-bottom:30px}
.email,.ou{font-size:1.6rem;margin:18px 0}
.btn{display:inline-block;background:#1d4ed8;color:#fff;padding:18px 38px;border-radius:50px;text-decoration:none;font-weight:bold}

.email-btn{display:inline-block;background:#1d4ed8;color:#fff;text-decoration:none;padding:16px 34px;border-radius:50px;font-size:1.2rem;font-weight:bold;transition:transform .25s ease,box-shadow .25s ease}
.email-btn:hover,.btn:hover,.email-btn:active,.btn:active{transform:scale(1.08);box-shadow:0 10px 25px rgba(0,0,0,.3)}
.btn{transition:transform .25s ease,box-shadow .25s ease}
</style>
</head><body>
<header><div class="logo-box"><img src="coroaba.jpg"></div></header>
<button class="menu-btn" id="menuBtn"><span class="menu-line"></span><span class="menu-line"></span><span class="menu-line"></span></button>
<nav class="nav-menu" id="navMenu">
<div class="menu-open-logo"><img src="coroaba.jpg"></div>
<div class="nav-links-container">

<a href="index.html#servicos">SERVIÇOS</a>
<a href="contato.html">ENTRE EM CONTATO</a>
</div></nav>
<div class="container">

   href="https://mail.google.com/mail/?view=cm&fs=1&to=estudiospixelsoficial@gmail.com&su=Solicitar%20um%20serviço"
   target="_blank">
    ENVIE-NOS UMA MENSAGEM POR E-MAIL
</a>
<div class="ou">OU</div>
<a class="btn" href="https://wa.me/5511978792642">ENVIE POR WHATSAPP</a>
</div>

</body></html>
